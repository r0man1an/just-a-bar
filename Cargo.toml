[package]
name = "just-a-bar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A top desktop panel for wlroots-based Wayland compositors (niri, wayfire, labwc, ...), built with gtk4-layer-shell."
license = "MIT"

[[bin]]
name = "jbar"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", package = "gtk4" }
gtk4-layer-shell = "0.8"
gio = "0.22"

wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
async-channel = "2"
xkbcommon = "0.7"
niri-ipc = "=26.4.0"
kdl = { version = "6", features = ["v1"] }

shlex = "2"
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2
lto = true
strip = true
